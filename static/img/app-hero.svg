<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232A3D"/>
      <stop offset="0.55" stop-color="#1B2340"/>
      <stop offset="1" stop-color="#3B2A5A"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="ny" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3A3"/>
      <stop offset="1" stop-color="#FFE866"/>
    </linearGradient>
    <linearGradient id="np" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC4DC"/>
      <stop offset="1" stop-color="#FF9FC6"/>
    </linearGradient>
    <linearGradient id="nb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B4D8FF"/>
      <stop offset="1" stop-color="#8AC6FF"/>
    </linearGradient>
    <linearGradient id="ng" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9ECBD"/>
      <stop offset="1" stop-color="#A8E09C"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1280" height="800" fill="url(#wall)"/>
  <circle cx="1080" cy="120" r="180" fill="#7C5CFF" opacity="0.25"/>
  <circle cx="180" cy="640" r="220" fill="#00C2FF" opacity="0.16"/>

  <!-- ícones desktop -->
  <g fill="#fff" opacity="0.55" font-size="13">
    <rect x="28" y="30" width="44" height="44" rx="10" fill="#fff" opacity="0.14"/>
    <text x="34" y="58" font-size="22">📁</text><text x="28" y="90">Projetos</text>
    <rect x="28" y="110" width="44" height="44" rx="10" fill="#fff" opacity="0.14"/>
    <text x="34" y="138" font-size="22">💻</text><text x="28" y="170">VS Code</text>
  </g>

  <!-- janela de código ao fundo -->
  <g filter="url(#sh2)" opacity="0.96">
    <rect x="150" y="110" width="760" height="520" rx="14" fill="#161B2E"/>
    <rect x="150" y="110" width="760" height="46" rx="14" fill="#1E2542"/>
    <rect x="150" y="140" width="760" height="16" fill="#1E2542"/>
    <circle cx="178" cy="133" r="6" fill="#FF5F57"/><circle cx="200" cy="133" r="6" fill="#FEBC2E"/><circle cx="222" cy="133" r="6" fill="#28C840"/>
    <rect x="150" y="156" width="180" height="474" fill="#141832"/>
    <g font-family="Consolas, monospace" font-size="17" fill="#9DA8D0">
      <text x="360" y="220" fill="#7C8AE4">var</text><text x="400" y="220" fill="#E6E9FF"> pagamento = pix接收();</text>
      <text x="360" y="254" fill="#7C8AE4">if</text><text x="390" y="254" fill="#E6E9FF"> (pagamento.ok) {</text>
      <text x="390" y="288" fill="#68D391">enviarNotaFiscal();</text>
      <text x="390" y="322" fill="#68D391">agendarEntrega();</text>
      <text x="360" y="356" fill="#E6E9FF">}</text>
      <text x="360" y="396" fill="#5A648C">// TODO: lembrar de cobrar o cliente…</text>
    </g>
  </g>

  <!-- nota 1 amarela -->
  <g filter="url(#sh)" transform="rotate(-4 330 420)">
    <rect x="210" y="280" width="250" height="280" rx="6" fill="url(#ny)"/>
    <rect x="285" y="271" width="100" height="24" rx="3" fill="#fff" opacity="0.55"/>
    <text x="230" y="325" font-size="19" font-weight="700" fill="#1F1F1F">💡 Ideia de app</text>
    <g font-size="15" fill="#2A2A2A">
      <text x="230" y="355">• onboard em 10 segundos</text>
      <text x="230" y="380">• sem login, sem nuvem</text>
      <text x="230" y="405">• tudo criptografado</text>
      <text x="230" y="430">• lançar sexta 🚀</text>
    </g>
    <text x="230" y="535" font-size="12" fill="#2A2A2A" opacity="0.7">✓ salvo agora mesmo</text>
  </g>

  <!-- nota 2 rosa -->
  <g filter="url(#sh)" transform="rotate(3 640 420)">
    <rect x="520" y="300" width="250" height="260" rx="6" fill="url(#np)"/>
    <rect x="595" y="291" width="100" height="24" rx="3" fill="#fff" opacity="0.55"/>
    <text x="540" y="345" font-size="19" font-weight="700" fill="#1F1F1F">🛒 Compras</text>
    <g font-size="15" fill="#2A2A2A">
      <text x="540" y="375">☐ café forte</text>
      <text x="540" y="400">☐ presente da mãe</text>
      <text x="540" y="425">☑ ração do Thor 🐶</text>
      <text x="540" y="450">☐ pilha AAA</text>
    </g>
  </g>

  <!-- nota 3 azul pequena -->
  <g filter="url(#sh)" transform="rotate(-2 830 300)">
    <rect x="720" y="180" width="230" height="200" rx="6" fill="url(#nb)"/>
    <text x="740" y="222" font-size="18" font-weight="700" fill="#1F1F1F">✈️ Viagem</text>
    <g font-size="14" fill="#2A2A2A">
      <text x="740" y="252">GRU → LIS · 22:40</text>
      <text x="740" y="277">reserva: XK-4921</text>
      <text x="740" y="302">não esquecer passaporte!</text>
    </g>
  </g>

  <!-- nota 4 verde -->
  <g filter="url(#sh)" transform="rotate(2 880 540)">
    <rect x="790" y="430" width="210" height="170" rx="6" fill="url(#ng)"/>
    <text x="810" y="470" font-size="17" font-weight="700" fill="#1F1F1F">📞 Ligar</text>
    <text x="810" y="498" font-size="14" fill="#2A2A2A">contador até quinta</text>
    <text x="810" y="522" font-size="14" fill="#2A2A2A">levar NF + contrato</text>
  </g>

  <!-- deck lateral expandido -->
  <g filter="url(#sh2)">
    <rect x="1120" y="60" width="100" height="620" rx="16" fill="#2B2B2B"/>
    <rect x="1120" y="60" width="100" height="620" rx="16" fill="url(#glass)"/>
    <rect x="1132" y="80" width="76" height="86" rx="10" fill="url(#ny)"/>
    <text x="1170" y="126" font-size="13" font-weight="700" fill="#1F1F1F" text-anchor="middle" transform="rotate(-90 1170 126)">Ideia</text>
    <rect x="1132" y="172" width="76" height="86" rx="10" fill="url(#np)"/>
    <text x="1170" y="218" font-size="13" font-weight="700" fill="#1F1F1F" text-anchor="middle" transform="rotate(-90 1170 218)">Compras</text>
    <rect x="1132" y="264" width="76" height="86" rx="10" fill="url(#nb)"/>
    <text x="1170" y="310" font-size="13" font-weight="700" fill="#1F1F1F" text-anchor="middle" transform="rotate(-90 1170 310)">Viagem</text>
    <rect x="1132" y="356" width="76" height="86" rx="10" fill="url(#ng)"/>
    <text x="1170" y="402" font-size="13" font-weight="700" fill="#1F1F1F" text-anchor="middle" transform="rotate(-90 1170 402)">Ligar</text>
    <rect x="1132" y="470" width="76" height="52" rx="10" fill="#3A3A3A" stroke="#555" stroke-width="1.5"/>
    <text x="1170" y="503" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">+</text>
    <rect x="1132" y="530" width="76" height="52" rx="10" fill="#3A3A3A" stroke="#555" stroke-width="1.5"/>
    <text x="1170" y="561" font-size="18" fill="#fff" text-anchor="middle">▤</text>
    <rect x="1132" y="590" width="76" height="52" rx="10" fill="#3A3A3A" stroke="#555" stroke-width="1.5"/>
    <text x="1170" y="621" font-size="18" fill="#fff" text-anchor="middle">⚙</text>
  </g>

  <!-- badge -->
  <g filter="url(#sh2)">
    <rect x="1152" y="648" width="36" height="36" rx="18" fill="#111"/>
    <text x="1170" y="673" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">4</text>
  </g>

  <!-- barra de tarefas -->
  <rect x="0" y="752" width="1280" height="48" fill="#0E1226" opacity="0.92"/>
  <rect x="16" y="762" width="28" height="28" rx="6" fill="#0078D4"/>
  <text x="20" y="783" font-size="16" fill="#fff">▦</text>
  <rect x="560" y="762" width="160" height="28" rx="6" fill="#fff" opacity="0.12"/>
  <text x="600" y="782" font-size="14" fill="#fff" text-anchor="middle">Pesquisar</text>
  <text x="1230" y="783" font-size="14" fill="#fff">09:41</text>
</svg>
