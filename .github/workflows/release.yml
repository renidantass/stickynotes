name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore StickyNotes.slnx

      - name: Build (Release)
        run: dotnet build StickyNotes.slnx -c Release --no-restore

      - name: Run smoke test
        run: dotnet run --project tools/DbSmokeTest --nologo

      - name: Publish (self-contained, win-x64)
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet publish src/StickyNotes.App/StickyNotes.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish/win-x64

      - name: Publish (self-contained, win-arm64)
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet publish src/StickyNotes.App/StickyNotes.App.csproj -c Release -r win-arm64 --self-contained true -p:PublishSingleFile=false -o publish/win-arm64

      - name: Package artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path publish/win-x64/* -DestinationPath StickyNotes-win-x64.zip
          Compress-Archive -Path publish/win-arm64/* -DestinationPath StickyNotes-win-arm64.zip

      - name: Generate SHA-256 checksums
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # O release é um zip sem assinatura de código: o hash publicado é a
          # verificação disponível para o usuário conferir o download.
          $lines = foreach ($file in @('StickyNotes-win-x64.zip', 'StickyNotes-win-arm64.zip')) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $file"
          }
          $lines | Set-Content -Path checksums.txt -Encoding ascii

      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: sticky-notes-build
          path: |
            StickyNotes-win-x64.zip
            StickyNotes-win-arm64.zip
            checksums.txt

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sticky-notes-build
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/checksums.txt
          generate_release_notes: true
